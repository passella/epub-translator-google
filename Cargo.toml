[package]
name = "epub-translator-google"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "form"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
inquire = "0.9.4"
indicatif = "0.18.6"
zstd = "0.14.3"
dirs = "7.0.0"
sha2 = "0.11.1"
zeroize = { version = "1.9.1", features = ["serde"] }
