name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

permissions:
  contents: read # Default read-only access for repository contents

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Format, Clippy & Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Read-only access for repository check and audit
    env:
      CARGO_INCREMENTAL: "0"
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Cargo version and resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CARGO_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "${CARGO_VERSION}" =~ ${SEMVER_REGEX} ]]; then
            echo "Error: Cargo.toml package.version '${CARGO_VERSION}' is not valid SemVer 2.0.0." >&2
            exit 1
          fi
          EXPECTED_TAG="v${CARGO_VERSION}"
          if [[ "${EVENT_NAME}" == "push" && "${REF_TYPE}" == "tag" && "${REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Error: Git tag '${REF_NAME}' does not match Cargo.toml version '${EXPECTED_TAG}'." >&2
            exit 1
          fi
          echo "tag=${EXPECTED_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup default 1.99.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Run secure cargo-audit
        run: |
          set -euo pipefail
          AUDIT_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/cargo-audit.XXXXXX")"
          trap 'rm -rf "${AUDIT_DIR}"' EXIT

          CARGO_AUDIT_VERSION="v0.23.0"
          CARGO_AUDIT_ARCHIVE="cargo-audit-x86_64-unknown-linux-gnu-${CARGO_AUDIT_VERSION}.tgz"
          CARGO_AUDIT_URL="https://github.com/rustsec/rustsec/releases/download/cargo-audit/${CARGO_AUDIT_VERSION}/${CARGO_AUDIT_ARCHIVE}"
          CARGO_AUDIT_SHA256="b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59"

          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-redirs 3 "${CARGO_AUDIT_URL}" -o "${AUDIT_DIR}/${CARGO_AUDIT_ARCHIVE}"
          printf '%s  %s\n' "${CARGO_AUDIT_SHA256}" "${AUDIT_DIR}/${CARGO_AUDIT_ARCHIVE}" | sha256sum -c -
          tar --no-same-owner --no-same-permissions -xzf "${AUDIT_DIR}/${CARGO_AUDIT_ARCHIVE}" -C "${AUDIT_DIR}" --strip-components=1

          "${AUDIT_DIR}/cargo-audit" audit --deny warnings

  build:
    name: Build Static Musl (${{ matrix.target }})
    needs: [check]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Read-only access for repository checkout
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            bin_name: epub-translator-google-linux-x86_64
            cc_env: CC_x86_64_unknown_linux_musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            bin_name: epub-translator-google-linux-aarch64
            cc_env: CC_aarch64_unknown_linux_musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target "${TARGET}"
          rustup default 1.99.0

      - name: Build static musl release binary and package assets
        env:
          TAG: ${{ needs.check.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin_name }}
          CC_ENV_VAR: ${{ matrix.cc_env }}
        run: |
          set -euo pipefail
          export "${CC_ENV_VAR}=musl-gcc"
          export RUSTFLAGS="-C target-feature=+crt-static"

          cargo build --release --locked --target "${TARGET}"

          BIN_PATH="target/${TARGET}/release/epub-translator-google"
          strip "${BIN_PATH}"

          file "${BIN_PATH}"
          file "${BIN_PATH}" | grep -iE 'static|statically'
          "${BIN_PATH}" --version

          rm -rf dist staging
          mkdir -p dist staging

          install -m 0755 "${BIN_PATH}" staging/epub-translator-google
          cp README.md staging/README.md
          tar -czf "dist/epub-translator-google-${TAG}-${TARGET}.tar.gz" -C staging epub-translator-google README.md

          install -m 0755 "${BIN_PATH}" "dist/${BIN_NAME}"
          ls -lh dist/

      - name: Upload target artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  smoke-x86_64:
    name: Smoke Test Static Musl (x86_64)
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Read-only access for artifact download

    steps:
      - name: Download x86_64 musl artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: x86_64-unknown-linux-musl
          path: dist

      - name: Validate static musl binary and tarball on x86_64
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/smoke-x86_64.XXXXXX")"
          trap 'rm -rf "${SMOKE_DIR}"' EXIT

          chmod +x dist/epub-translator-google-linux-x86_64
          file dist/epub-translator-google-linux-x86_64
          file dist/epub-translator-google-linux-x86_64 | grep -iE 'static|statically'
          ./dist/epub-translator-google-linux-x86_64 --version
          ./dist/epub-translator-google-linux-x86_64 --help

          tar -xzf "dist/epub-translator-google-${TAG}-x86_64-unknown-linux-musl.tar.gz" -C "${SMOKE_DIR}"
          test -f "${SMOKE_DIR}/README.md"
          test -x "${SMOKE_DIR}/epub-translator-google"
          "${SMOKE_DIR}/epub-translator-google" --version
          "${SMOKE_DIR}/epub-translator-google" --help

      - name: Run offline EPUB verify smoke test on x86_64
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/smoke-verify-x86_64.XXXXXX")"
          trap 'rm -rf "${SMOKE_DIR}"' EXIT

          mkdir -p "${SMOKE_DIR}/bin"
          tar -xzf "dist/epub-translator-google-${TAG}-x86_64-unknown-linux-musl.tar.gz" -C "${SMOKE_DIR}/bin"

          SMOKE_DIR="${SMOKE_DIR}" python3 - <<'PY'
          import os
          import zipfile

          smoke_dir = os.environ["SMOKE_DIR"]
          valid_epub = os.path.join(smoke_dir, "valid.epub")
          invalid_epub = os.path.join(smoke_dir, "invalid.epub")

          with zipfile.ZipFile(valid_epub, "w") as zf:
              zf.writestr("mimetype", b"application/epub+zip", compress_type=zipfile.ZIP_STORED)
              zf.writestr(
                  "META-INF/container.xml",
                  '<?xml version="1.0" encoding="UTF-8"?>'
                  '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">'
                  "<rootfiles>"
                  '<rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>'
                  "</rootfiles>"
                  "</container>",
                  compress_type=zipfile.ZIP_DEFLATED,
              )
              zf.writestr(
                  "OEBPS/content.opf",
                  '<?xml version="1.0" encoding="UTF-8"?>'
                  '<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid">'
                  '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">'
                  '<dc:identifier id="uid">smoke-test</dc:identifier>'
                  "<dc:title>Smoke</dc:title>"
                  "<dc:language>en</dc:language>"
                  "</metadata>"
                  "<manifest>"
                  '<item id="ch1" href="ch1.xhtml" media-type="application/xhtml+xml"/>'
                  "</manifest>"
                  "<spine>"
                  '<itemref idref="ch1"/>'
                  "</spine>"
                  "</package>",
                  compress_type=zipfile.ZIP_DEFLATED,
              )
              zf.writestr(
                  "OEBPS/ch1.xhtml",
                  '<?xml version="1.0" encoding="UTF-8"?>'
                  '<html xmlns="http://www.w3.org/1999/xhtml">'
                  "<head><title>Smoke</title></head>"
                  "<body><p>Hello</p></body>"
                  "</html>",
                  compress_type=zipfile.ZIP_DEFLATED,
              )

          with zipfile.ZipFile(invalid_epub, "w") as zf:
              zf.writestr("mimetype", b"application/epub+zip", compress_type=zipfile.ZIP_DEFLATED)
          PY
          "${SMOKE_DIR}/bin/epub-translator-google" verify "${SMOKE_DIR}/valid.epub"
          if "${SMOKE_DIR}/bin/epub-translator-google" verify "${SMOKE_DIR}/invalid.epub"; then
            echo "Expected verify to fail on invalid EPUB without stored mimetype" >&2
            exit 1
          fi

  smoke-aarch64:
    name: Smoke Test Static Musl (aarch64)
    needs: [check, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read # Read-only access for artifact download

    steps:
      - name: Download aarch64 musl artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aarch64-unknown-linux-musl
          path: dist

      - name: Validate static musl binary and tarball on aarch64
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/smoke-aarch64.XXXXXX")"
          trap 'rm -rf "${SMOKE_DIR}"' EXIT

          chmod +x dist/epub-translator-google-linux-aarch64
          file dist/epub-translator-google-linux-aarch64
          file dist/epub-translator-google-linux-aarch64 | grep -iE 'static|statically'
          ./dist/epub-translator-google-linux-aarch64 --version
          ./dist/epub-translator-google-linux-aarch64 --help

          tar -xzf "dist/epub-translator-google-${TAG}-aarch64-unknown-linux-musl.tar.gz" -C "${SMOKE_DIR}"
          test -f "${SMOKE_DIR}/README.md"
          test -x "${SMOKE_DIR}/epub-translator-google"
          "${SMOKE_DIR}/epub-translator-google" --version
          "${SMOKE_DIR}/epub-translator-google" --help

      - name: Run offline EPUB verify smoke test on aarch64
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/smoke-verify-aarch64.XXXXXX")"
          trap 'rm -rf "${SMOKE_DIR}"' EXIT

          mkdir -p "${SMOKE_DIR}/bin"
          tar -xzf "dist/epub-translator-google-${TAG}-aarch64-unknown-linux-musl.tar.gz" -C "${SMOKE_DIR}/bin"

          SMOKE_DIR="${SMOKE_DIR}" python3 - <<'PY'
          import os
          import zipfile

          smoke_dir = os.environ["SMOKE_DIR"]
          valid_epub = os.path.join(smoke_dir, "valid.epub")
          invalid_epub = os.path.join(smoke_dir, "invalid.epub")

          with zipfile.ZipFile(valid_epub, "w") as zf:
              zf.writestr("mimetype", b"application/epub+zip", compress_type=zipfile.ZIP_STORED)
              zf.writestr(
                  "META-INF/container.xml",
                  '<?xml version="1.0" encoding="UTF-8"?>'
                  '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">'
                  "<rootfiles>"
                  '<rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>'
                  "</rootfiles>"
                  "</container>",
                  compress_type=zipfile.ZIP_DEFLATED,
              )
              zf.writestr(
                  "OEBPS/content.opf",
                  '<?xml version="1.0" encoding="UTF-8"?>'
                  '<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid">'
                  '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">'
                  '<dc:identifier id="uid">smoke-test</dc:identifier>'
                  "<dc:title>Smoke</dc:title>"
                  "<dc:language>en</dc:language>"
                  "</metadata>"
                  "<manifest>"
                  '<item id="ch1" href="ch1.xhtml" media-type="application/xhtml+xml"/>'
                  "</manifest>"
                  "<spine>"
                  '<itemref idref="ch1"/>'
                  "</spine>"
                  "</package>",
                  compress_type=zipfile.ZIP_DEFLATED,
              )
              zf.writestr(
                  "OEBPS/ch1.xhtml",
                  '<?xml version="1.0" encoding="UTF-8"?>'
                  '<html xmlns="http://www.w3.org/1999/xhtml">'
                  "<head><title>Smoke</title></head>"
                  "<body><p>Hello</p></body>"
                  "</html>",
                  compress_type=zipfile.ZIP_DEFLATED,
              )

          with zipfile.ZipFile(invalid_epub, "w") as zf:
              zf.writestr("mimetype", b"application/epub+zip", compress_type=zipfile.ZIP_DEFLATED)
          PY
          "${SMOKE_DIR}/bin/epub-translator-google" verify "${SMOKE_DIR}/valid.epub"
          if "${SMOKE_DIR}/bin/epub-translator-google" verify "${SMOKE_DIR}/invalid.epub"; then
            echo "Expected verify to fail on invalid EPUB without stored mimetype" >&2
            exit 1
          fi

  publish:
    name: Publish GitHub Release
    needs: [check, build, smoke-x86_64, smoke-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Write access for publishing release tags and assets
      pull-requests: read # Read-only access for fetching pull request notes
      id-token: write # Write access for OIDC token generation
      attestations: write # Write access for build provenance attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clean dist directory
        run: rm -rf dist

      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-unknown-linux-musl'
          path: dist
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum \
              "epub-translator-google-${TAG}-x86_64-unknown-linux-musl.tar.gz" \
              "epub-translator-google-${TAG}-aarch64-unknown-linux-musl.tar.gz" \
              "epub-translator-google-linux-x86_64" \
              "epub-translator-google-linux-aarch64" \
              > SHA256SUMS.txt
          )
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/epub-translator-google-${{ needs.check.outputs.tag }}-x86_64-unknown-linux-musl.tar.gz
            dist/epub-translator-google-${{ needs.check.outputs.tag }}-aarch64-unknown-linux-musl.tar.gz
            dist/epub-translator-google-linux-x86_64
            dist/epub-translator-google-linux-aarch64

      - name: Generate release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-notes.XXXXXX")"
          trap 'rm -f "${NOTES_DIR}/pr.json"' EXIT
          trap 'rm -rf "${NOTES_DIR}"' ERR

          PR_JSON_PATH="${NOTES_DIR}/pr.json"
          NOTES_PATH="${NOTES_DIR}/release_notes.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > "${PR_JSON_PATH}" || true

          PR_JSON_PATH="${PR_JSON_PATH}" NOTES_PATH="${NOTES_PATH}" python3 - <<'PY'
          import json
          import os
          import subprocess

          pr_json_path = os.environ["PR_JSON_PATH"]
          notes_path = os.environ["NOTES_PATH"]
          notes = ""

          if os.path.exists(pr_json_path) and os.path.getsize(pr_json_path) > 0:
              try:
                  with open(pr_json_path, "r", encoding="utf-8") as fh:
                      data = json.load(fh)
                  if isinstance(data, list):
                      merged = [p for p in data if isinstance(p, dict) and p.get("merged_at")]
                      pr = merged[0] if merged else None
                  else:
                      pr = None
                  if pr:
                      title = (pr.get("title") or "").strip()
                      body = (pr.get("body") or "").strip()
                      if body:
                          notes = f"## {title}\n\n{body}\n" if title else f"{body}\n"
              except Exception:
                  notes = ""

          if not notes.strip():
              notes = subprocess.check_output(
                  ["git", "log", "-1", "--pretty=%B"],
                  text=True,
              )

          with open(notes_path, "w", encoding="utf-8") as fh:
              fh.write(notes)
          PY
          echo "notes_file=${NOTES_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'rm -rf "$(dirname "${NOTES_FILE}")"' EXIT
          if gh release view "${TAG}" &>/dev/null; then
            gh release delete "${TAG}" --yes --cleanup-tag || true
          fi
          gh release create "${TAG}" \
            "dist/epub-translator-google-${TAG}-x86_64-unknown-linux-musl.tar.gz" \
            "dist/epub-translator-google-${TAG}-aarch64-unknown-linux-musl.tar.gz" \
            "dist/epub-translator-google-linux-x86_64" \
            "dist/epub-translator-google-linux-aarch64" \
            "dist/SHA256SUMS.txt" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}"
