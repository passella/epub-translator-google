name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Format, Clippy & Unit/Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # 1.99.0
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  release-smoke:
    name: Release Build & CLI Smoke Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # 1.99.0
        with:
          toolchain: 1.99.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release binary and run CLI smoke checks
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d "${RUNNER_TEMP}/ci-smoke.XXXXXX")"
          trap 'rm -rf "${SMOKE_DIR}"' EXIT

          cargo build --release --locked
          ./target/release/epub-translator-google --version
          ./target/release/epub-translator-google --help
          SMOKE_DIR="${SMOKE_DIR}" python3 - <<'EOF'
          import os
          import zipfile

          smoke_dir = os.environ["SMOKE_DIR"]
          valid_epub = os.path.join(smoke_dir, "ci_smoke.epub")
          invalid_epub = os.path.join(smoke_dir, "ci_smoke_invalid.epub")

          with zipfile.ZipFile(valid_epub, 'w') as zf:
              zf.writestr('mimetype', b'application/epub+zip', compress_type=zipfile.ZIP_STORED)
              zf.writestr(
                  'META-INF/container.xml',
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">\n'
                  '  <rootfiles>\n'
                  '    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>\n'
                  '  </rootfiles>\n'
                  '</container>\n',
                  compress_type=zipfile.ZIP_DEFLATED,
              )
              zf.writestr(
                  'OEBPS/content.opf',
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid">\n'
                  '  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">\n'
                  '    <dc:identifier id="uid">urn:uuid:00000000-0000-0000-0000-000000000001</dc:identifier>\n'
                  '    <dc:title>CI Smoke Test</dc:title>\n'
                  '    <dc:language>en</dc:language>\n'
                  '  </metadata>\n'
                  '  <manifest>\n'
                  '    <item id="ch1" href="chapter1.xhtml" media-type="application/xhtml+xml"/>\n'
                  '  </manifest>\n'
                  '  <spine>\n'
                  '    <itemref idref="ch1"/>\n'
                  '  </spine>\n'
                  '</package>\n',
                  compress_type=zipfile.ZIP_DEFLATED,
              )
              zf.writestr(
                  'OEBPS/chapter1.xhtml',
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<html xmlns="http://www.w3.org/1999/xhtml">\n'
                  '  <head><title>Chapter 1</title></head>\n'
                  '  <body><p>Smoke test content.</p></body>\n'
                  '</html>\n',
                  compress_type=zipfile.ZIP_DEFLATED,
              )

          with zipfile.ZipFile(invalid_epub, 'w') as zf:
              zf.writestr('mimetype', b'application/epub+zip', compress_type=zipfile.ZIP_DEFLATED)
          EOF
          ./target/release/epub-translator-google verify "${SMOKE_DIR}/ci_smoke.epub"
          if ./target/release/epub-translator-google verify "${SMOKE_DIR}/ci_smoke_invalid.epub"; then
            echo "Expected verify to fail on invalid EPUB without stored mimetype" >&2
            exit 1
          fi
          HISTORY_JSON="$(./target/release/epub-translator-google --db-cache "${SMOKE_DIR}/empty.db" history --format json)"
          printf '%s\n' "${HISTORY_JSON}" | python3 -c 'import json, sys; assert json.load(sys.stdin) == []'

  security-audit:
    name: Security Audit (RustSec)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  workflow-audit:
    name: Workflow Audit (zizmor & actionlint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor workflow audit
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          advanced-security: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
